 GER_the_hammer_to_fall_desc:0 "As the Reich's air command refines its strategic vision, the moment approaches when all will feel the weight of their miscalculation. With every bomber that takes to the skies, the enemy's fate is sealed. Their forces are no longer just combatants—they are the ill-fated victims of inevitable destruction. Each target is chosen with care, every strike planned with the precision of a craftsman wielding his hammer.\n\nIn these dark times, Lady Mercy no longer walks among us. There is no room for mercy as the hammer must fall. The enemy can flee, but they cannot escape. We will soon bring the heavens down upon the Untermenschen, leaving only ashes in our wake."
 
 #|---EVENTS---|# 
 
 reich_flavour.1.t:0 "The Fulfillment of a Struggle"
 reich_flavour.1.desc:0 "I stood there, shoulder to shoulder with the men of the SA, eyes fixed on the stage. My heart pounded in my chest as the Führer took his place before us. At 19, I had seen only glimpses of the old Germany—the Germany of chaos and shame—but in that moment, I felt like I was part of something eternal. The Führer’s voice, steady and powerful, filled the hall.\n\n“Men of the SA!” He started. “National Socialists! Party Comrades! When we take a retrospective look today, it does not end in the year 1933, but must go back further. What was a moment of surprise back then for many who did not know our Movement, was for us and for you, my Old Fighters, but the hour of fulfilment..."\n\nThe older men beside me—veterans of the long struggle—stood tall. I could see the pride in their eyes. They had lived through the dark times, but I… I was the product of this new Germany, this resurgence, this strength. I hadn't known the hunger or the despair that came before, but standing there, listening to the Führer, I understood what we fought for.\n\n"I conducted the fight for fourteen years; I also founded this SA and, in its ranks and at its fore, led the Movement onward. I have come to know you. And I know, everything you are, you are through me, and everything I am, I am through you alone."His words gripped me, as though he spoke directly to me. I wasn’t just a soldier. I was a part of history—a link in the chain of a thousand year reich, soon to be achieved. The struggle wasn’t over, but we had risen from the ashes. And now, we were building something greater, something that would last a thousand years. I believed in it, felt it in my bones.\n\n"Our fight has required constant sacrifice. But you did not go through that. Perhaps you imagine Germany has become what it is today because you did not make any sacrifices. No! It is because we were able to make sacrifices and wanted to do so that this Germany came to be!"\n\nThe hall erupted in chants of “Sieg Heil,” and I found myself joining in, shouting until my voice was hoarse. This was my purpose. I was young, but I was ready to sacrifice whatever it took. I felt invincible, like nothing could stop us.\n\nAs the Führer’s final words echoed in the hall, I knew then that my life had meaning. Germany was rising, and I would give everything to see it triumph."
 reich_flavour.1.a:0 "For Germany, for the Reich!"
 reich_flavour.1.b:0 "We are the guardians of this future!"
 


