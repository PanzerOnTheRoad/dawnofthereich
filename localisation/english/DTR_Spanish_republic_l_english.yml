 spain_flavour.1.t:0 "A Glimmer of Hope?"
 spain_flavour.1.desc:0 "Clara stood on the makeshift stage in a small town square, her voice ringing out over the heads of the gathered workers. The crowd wasn’t large—only a handful of men and women, most with weary faces from long hours in the fields or factories. But their eyes were on her, and in those eyes, Clara saw hope. Each pair seemed to echo the same unspoken question: "Can we really change our future?" She felt the weight of that expectation and the gravity of the moment pressing down on her, but she welcomed it. It fueled her determination, igniting a fire within her that she was desperate to share.\n\n“We can win this election,” she declared, the passion in her voice swelling as she spoke. “We can build a new Spain, one where the workers have a voice, where the rich no longer control the fate of us all. It’s within our grasp! We’ve come so far, and we can’t stop now. The Republic is our chance to take control of our own destiny.” With each word, she could sense the energy in the crowd shifting, as if her conviction were a spark igniting dormant aspirations. She knew they had suffered too long under the weight of inequality and oppression, and she wanted them to feel that the tides were turning, that the power of change rested in their hands.\n\nShe paused for a moment, watching their faces, hoping to spark something inside them. Clara had seen too many of her friends and comrades beaten down by despair, their dreams eroded by the relentless grind of daily survival. The tension in Spain was growing every day, but Clara still believed in the power of the people. She had to. If she didn’t, then what was all this for?" 
 spain_flavour.1.a:0 "The People will rise."    

 spain_flavour.2.t:0 "The Silent Strategist"
 spain_flavour.2.desc:0 "Francisco Franco sat in his office, the soft glow of the evening sun casting long shadows on the map of Spain sprawled across his desk. Reports had been flooding in from every corner of the country—rumors of unrest, whispers of plots, and the growing unease within the military ranks. His hand rested on a telegram, an invitation from General Mola to join the conspiracy. In these uncertain times, he preferred to observe from a distance, measuring the unfolding political storm without revealing his hand. "Patience is key, Franco. Wait for the right opportunity." He told himself. The weight of the moment pressed upon him; he knew that the choices made now would shape the future of Spain for generations.\n\nTo many, Franco appeared overly cautious—perhaps even indecisive—but those close to him understood that his meticulous demeanor concealed a relentless ambition. He was acutely aware of the disarray within the Republic, where leftist factions grew bolder by the day, threatening to unravel the very fabric of Spanish society. Franco was clear in his resolve: Spain needed a return to order that would unify the nation under traditional values.\n\nAs he contemplated the invitation from Mola, he envisioned a Spain rooted in strength and stability, a nation free from the turmoil that plagued it. "I will reclaim what is rightfully ours," he mused. Franco understood that every decision he made was a calculated step toward his ultimate goal, laying the groundwork for a future that would restore Spain’s glory."
 spain_flavour.2.a:0 ""When the time comes, I will be ready—and that time is soon, my friend.""

 spain_flavour.3.t:0 "The Monarchist"
 spain_flavour.3.desc:0 "Tomás Domínguez Arévalo sat at his polished mahogany desk, fingers tracing the intricate family crest engraved on his paperweight. A scion of an ancient lineage, he embodied the essence of the Spanish nobility, steeped in tradition and pride. Outside his window, the lush gardens of his estate flourished under a bright sky, diverting attention from the turmoil gripping his beloved country beyond the high walls. Spain was not what it once was; the republic, in his eyes, was a fleeting experiment.\n\nAs he gazed out at the vibrant blossoms, his thoughts turned to the imminent storm. The monarchy, he believed, was the only beacon of hope that could restore order and stability to a nation spiraling into chaos. Tomás often found solace among the like-minded—traditionalists, Requetés, and loyalists who still clung to the good old ways. Whispers from military circles and Franco’s camp had reached him, yet he remained convinced that without the unifying force of a monarchy, Spain would remain lost, drifting aimlessly amid political strife.\n\n “If the monarchy is to be restored, we must act now,”"
 spain_flavour.3.a:0 "For Spain and the Crown."
 
 SPR_republic.1.t:0 "The Republic Holds its Breath"
 SPR_republic.1.desc:0 "With the 1936 elections over, Spain holds its breath as the final decision on the next Prime Minister draws near. The results have been shockingly close, with only a few thousand votes separating the political factions. Tensions across the nation have escalated, as both left and right-wing supporters claim victory for their respective sides.\n\nIn the coming days, President Manuel Azaña will meet with political leaders to confirm the nomination, a decision that could either stabilize the nation or deepen the divisions. Both supporters and opponents of the Popular Front know that the future of Spain rests on this fragile appointment, with uncertainty hanging over the country like a gathering storm.\n\nWith the nomination imminent, all eyes are on the Spanish Cortes. Whatever the outcome, the fragile state of the Republic is poised for yet another challenge."
 SPR_republic.1.a:0 "The Nation awaits..."

 SPR_republic.2.t:0 "Azaña's Narrow Victory"
 SPR_republic.2.desc:0 "The election results are in, and Manuel Azaña has emerged as the new Prime Minister of the Spanish Republic, though by the slimmest of margins. With only a few thousand votes separating him from his closest rivals, the victory is anything but decisive. As news of Azaña’s triumph spreads, reactions are mixed across the country—celebrations erupt in some quarters, while anger and disbelief dominate others. Many on the right feel robbed, convinced that the outcome was rigged by the leftist coalition.\n\nIn Madrid, Azaña’s supporters flood the streets, chanting slogans in favor of the Republic’s future under his leadership. Yet, just blocks away, tensions are rising as right-wing groups organize protests, denouncing the election as fraudulent. The razor-thin margin has only deepened the divides within the country, with fears that this fragile result will lead to further unrest."
 SPR_republic.2.a:0 "A New Era or a Darker Night?"
 
 SPR_republic.3.t:0 "The Gathering of the Generals"
 SPR_republic.3.desc:0 "Away from the eyes of Madrid’s ever-watchful Republic, three of Spain's most formidable generals—Emilio Mola, Francisco Franco, and José Sanjurjo—met to finalize plans that would soon plunge the country into chaos. Mola, the architect of the conspiracy, stood by a map of Spain, his finger tracing the cities where the uprising would ignite. His voice was calm, precise. “Our patience has paid off. The Republic is on its knees and is rotting from the inside. But we must strike before it regains any strength.” Franco, sitting stiffly, shook his head. "If we move too quickly, we risk chaos. The Army needs time to rally properly—we can't afford another reckless failure like Sanjurjo’s attempt in '32." His words landed heavily in the room, and Sanjurjo’s eyes narrowed.\n\nSanjurjo’s voice cut through the air. "We need more than just a plan. The Army needs a single leader—a Generalissimo—to guide them, and that should be me. I’ve led this nation’s forces before. My name commands respect." Franco's expression hardened, his eyes narrowing at Sanjurjo’s words. "Respect is earned on the battlefield, not from a failed coup," Franco retorted coldly. "Spain needs more than a figurehead. The Generalissimo should be someone who can unite and command the entire military front, not just a title. Someone who can handle this war with precision, not rash decisions." Sanjurjo slammed his fist on the table, his voice rising. "You speak as if you’ve led a coup before, Franco. I have! You can be as cautious as you like, but Spain doesn’t need a hesitant leader. My failures were lessons, Franco. You’ve never dared to take a risk. I’ve fought for Spain while you stood on the sidelines!"\n\nMola, sensing the meeting slipping into chaos, raised his hand to silence them. "Enough. We cannot afford to fracture before we’ve even begun," he said, his voice calm but commanding. "Spain is at the brink of total collapse. Yes, leadership is critical, but our focus now must be unity in the face of the Republic. Franco, Sanjurjo—this is not the time for personal ambitions. We strike together, or we fall together. Once we take control, we can settle who will lead the Army. For now, Spain needs all of us." Both Franco and Sanjurjo sat back, tension still simmering, but they knew Mola was right. The path forward was risky, but they shared a common goal: the fall of the Republic."
 SPR_republic.3.a:0 "For Now, There is Agreement"
 